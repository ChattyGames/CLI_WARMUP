<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>CLI Warm-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one slide-sized column. Mission on top, a real-looking terminal below it,
     coaching and the Next button underneath. Linux track is charcoal, PowerShell track is classic navy. */
  :root {
    --bg: #eef1f5; --fg: #17202b; --mute: #566273; --surface: #ffffff; --line: #cdd5df;
    --accent: #0b6e8a; --accent-ink: #ffffff; --good: #1b7a3e; --warn: #9a5700; --bad: #b42318;
    --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    /* terminals are dark in both themes on purpose */
    --lx-bg: #0e1116; --lx-fg: #d7dde5; --lx-dim: #8d98a6; --lx-user: #5fd38d; --lx-path: #6ea8fe; --lx-bar: #1b2129;
    --ps-bg: #012456; --ps-fg: #eeedf0; --ps-dim: #9fb3d6; --ps-bar: #0a3270; --ps-err: #ff6b6b; --ps-cmt: #f9f1a5;
    --err: #ff7b72;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --fg: #e7ecf2; --mute: #98a4b3; --surface: #171e27; --line: #2b3644;
      --accent: #5cc2dd; --accent-ink: #06222b; --good: #5fd38d; --warn: #f0b35a; --bad: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --fg: #e7ecf2; --mute: #98a4b3; --surface: #171e27; --line: #2b3644;
    --accent: #5cc2dd; --accent-ink: #06222b; --good: #5fd38d; --warn: #f0b35a; --bad: #ff8a80; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
  h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.1; text-wrap: balance; }
  .wo { margin: 4px 0 0; color: var(--mute); font-size: 14px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .daysel { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .tabs button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; background: transparent; color: var(--mute); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .tabs button:focus-visible, .btn:focus-visible, #cmd:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .progress { display: flex; gap: 4px; }
  .progress i { flex: 1; height: 7px; border-radius: 4px; background: var(--line); display: block; }
  .progress i.first { background: var(--good); }
  .progress i.retry { background: var(--accent); }
  .progress i.shown { background: var(--warn); }
  .progress i.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
  .count { margin: -6px 0 0; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .mission { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
  .label { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  #task { margin: 0; font-size: 20px; line-height: 1.35; text-wrap: pretty; }
  .term { border-radius: 10px; overflow: hidden; border: 1px solid #000; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-family: var(--font-mono); }
  .term .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12px; }
  .term .dots { display: flex; gap: 6px; }
  .term .dots b { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; display: block; }
  .term .dots b:nth-child(2) { background: #febc2e; } .term .dots b:nth-child(3) { background: #28c840; }
  .term .body { padding: 12px 14px 16px; font-size: 14px; line-height: 1.5; height: 340px; overflow: auto; }
  .term.linux { background: var(--lx-bg); color: var(--lx-fg); } .term.linux .bar { background: var(--lx-bar); color: var(--lx-dim); }
  .term.ps { background: var(--ps-bg); color: var(--ps-fg); } .term.ps .bar { background: var(--ps-bar); color: var(--ps-dim); }
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  .out { white-space: pre; margin: 0; font: inherit; }
  .linux .dim { color: var(--lx-dim); } .ps .dim { color: var(--ps-dim); }
  .linux .err { color: var(--err); } .ps .err { color: var(--ps-err); }
  .linux .u { color: var(--lx-user); font-weight: 700; } .linux .p { color: var(--lx-path); font-weight: 700; }
  .cmdtxt { white-space: pre-wrap; overflow-wrap: anywhere; }
  #form { display: flex; flex-wrap: wrap; align-items: baseline; margin: 0; }
  .pr { white-space: nowrap; }
  #cmd { flex: 1 1 10ch; min-width: 10ch; background: transparent; border: 0; color: inherit; font: inherit; padding: 0 0 0 .6ch; caret-color: currentColor; }
  #cmd:disabled { opacity: 1; }
  #cmd:focus-visible { outline: none; }
  #form:focus-within { background: rgba(255,255,255,.05); border-radius: 3px; }
  .coach { min-height: 3.2em; font-size: 16px; }
  .coach p { margin: 0; }
  .coach .ok { color: var(--good); font-weight: 600; }
  .coach .no { color: var(--bad); font-weight: 600; }
  .coach code, .sum code { font-family: var(--font-mono); font-size: .9em; background: color-mix(in srgb, var(--fg) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { font: inherit; font-weight: 600; font-size: 15px; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sum { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .sum h2 { margin: 0 0 8px; font-size: 22px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 12px; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  .stats b { font-size: 20px; }
  .log { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 4px; }
  .log li { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  .log code { flex: 0 1 auto; }
  .log span { color: var(--mute); }
  .shake { animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  @media (max-width: 520px) { h1 { font-size: 24px; } #task { font-size: 18px; } .term .body { height: 300px; font-size: 13px; } }
</style>

</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="dayLabel">AP Networking &middot; Day 1</p>
      <h1>CLI Warm-Up</h1>
      <p class="wo" id="wo">Work order: Computer Lab Disconnected</p>
      <p class="wo" id="notice" hidden></p>
    </div>
    <div class="ctl">
    <select id="daySel" class="daysel" aria-label="Choose a day" hidden></select>
    <div class="tabs" role="tablist" aria-label="Choose your terminal">
      <button role="tab" id="tab-linux" aria-selected="true" data-track="linux">Linux</button>
      <button role="tab" id="tab-ps" aria-selected="false" data-track="ps">PowerShell</button>
    </div>
    </div>
  </header>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <p class="count" id="count"></p>

  <section class="mission" id="missionBox">
    <p class="label">Mission</p>
    <p id="task"></p>
  </section>

  <section class="term linux" id="term" aria-label="Practice terminal">
    <div class="bar"><span class="dots"><b></b><b></b><b></b></span><span id="termTitle"></span></div>
    <div class="body" id="body">
      <form id="form" autocomplete="off">
        <span class="pr" id="promptSlot"></span>
        <label for="cmd" style="position:absolute;left:-9999px">Type your command</label>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </form>
    </div>
  </section>

  <div class="coach" id="coach" aria-live="polite"></div>
  <div class="actions" id="actions"></div>

  <section class="sum" id="summary" hidden></section>
</main>

<script>
var DAYS = { d01: { label: 'Day 1 \u00b7 Wed 10/28', date: '2026-10-28', wo: 'Work order: Computer Lab Disconnected', tracks: {
  linux: {
    name: 'Linux',
    cls: 'linux',
    start: '~',
    title: function (cwd) { return 'student@' + (this.host || 'kali') + ': ' + cwd; },
    banner: ['Kali GNU/Linux Rolling \u00b7 station KALI-03 \u00b7 Blue Land', 'Type a command and press Enter.'],
    notFound: function (c) { return 'bash: ' + c + ': command not found'; },
    known: 'pwd ls cd mkdir rmdir ip ifconfig ping nslookup dig host cat echo whoami id su touch rm cp mv grep find man head tail wc sort uniq diff hostname uname ss ps traceroute clear date history'.split(' '),
    screens: [
      { task: 'You just logged in. Print the directory you are standing in.',
        accept: [{ re: /^pwd$/ }], answer: 'pwd', hint: 'Three letters. It stands for "print working directory".',
        out: '/home/student', what: 'where am I?',
        why: '<code>pwd</code> answers "where am I?" before you touch anything.' },
      { task: 'List what is in this directory.',
        accept: [{ re: /^ls( -[a-zA-Z]+)?$/ }], answer: 'ls', hint: 'Two letters, short for "list".',
        out: 'Desktop  Documents  blueland  notes.txt', what: 'what is here?',
        why: '<code>ls</code> shows the room you are standing in. You can only walk into a folder whose name you can see.' },
      { task: 'Walk into the folder named <code>blueland</code>.',
        accept: [{ re: /^cd (\.\/)?blueland\/?$/ }], answer: 'cd blueland', hint: 'Two words: the command that changes directory, then the folder name.',
        partial: [{ re: /^cd$/, msg: '<code>cd</code> needs to know where to go. Give it the folder name.' }],
        out: '', cwd: '~/blueland', what: 'move into a folder',
        why: 'Notice the prompt changed. The path in it follows you around.' },
      { task: 'Step back out one level, to where you started.',
        accept: [{ re: /^cd \.\.\/?$/ }], answer: 'cd ..', hint: 'Same command as before. The place to go is two dots.',
        partial: [{ re: /^cd ?\.$/, msg: 'One dot means "right here". Two dots mean "the folder above".' }],
        out: '', cwd: '~', what: 'move up one level',
        why: '<code>..</code> always means the folder above you.' },
      { task: 'Build a new directory named <code>cleared</code>.',
        accept: [{ re: /^mkdir (-p )?(\.\/)?cleared\/?$/ }], answer: 'mkdir cleared', hint: 'Short for "make directory".',
        out: '', what: 'make a folder',
        why: '<code>mkdir</code> builds a new room. Nothing prints when it works, which is normal in Linux.' },
      { task: 'New work order: the lab has no network. Show this station\'s IP addresses.',
        accept: [
          { re: /^ip (a|addr|address)( show)?$/ },
          { re: /^ip -br(ief)? a(ddr)?$/, out: 'lo               UNKNOWN        127.0.0.1/8\neth0             UP             192.168.50.110/24' },
          { re: /^ifconfig$/, note: '<code>ifconfig</code> works on some systems, but <code>ip addr</code> is the one to learn.',
            out: 'eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet 192.168.50.110  netmask 255.255.255.0  broadcast 192.168.50.255\n        ether 02:42:ac:11:00:03  txqueuelen 1000  (Ethernet)' }
        ],
        answer: 'ip addr', hint: 'The command is <code>ip</code>. It needs a second word for "address".',
        partial: [{ re: /^ip$/, msg: '<code>ip</code> alone just prints help. It needs a second word for what you want to see.' }],
        out: '1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 state UNKNOWN\n    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 state UP\n    link/ether 02:42:ac:11:00:03 brd ff:ff:ff:ff:ff:ff\n    inet 192.168.50.110/24 brd 192.168.50.255 scope global dynamic eth0',
        what: 'show IP addresses',
        why: 'A real address, and the word <code>dynamic</code> means DHCP handed it out. Not 169.254, so DHCP worked.' },
      { task: 'The address looks healthy. Now find the <b>default gateway</b>.',
        accept: [{ re: /^ip (r|route)( show)?$/ }], answer: 'ip route', hint: 'Same <code>ip</code> command, but this time ask for the routes.',
        out: 'default via 192.168.50.1 dev eth0 proto dhcp metric 100\n192.168.50.0/24 dev eth0 proto kernel scope link src 192.168.50.110', what: 'show the gateway',
        why: 'The line that starts with <code>default via</code> is your gateway: 192.168.50.1.' },
      { task: 'Test the gateway (192.168.50.1). Send <b>exactly four</b> pings.',
        accept: [{ re: /^ping -c ?4 192\.168\.50\.1$/ }, { re: /^ping 192\.168\.50\.1 -c ?4$/ }],
        answer: 'ping -c 4 192.168.50.1', hint: 'On Linux, ping never stops on its own. One flag, <code>-c</code>, sets the count.',
        partial: [
          { re: /^ping 192\.168\.50\.1$/, msg: 'On Linux, ping keeps going until you press Ctrl+C. Add the flag that limits how many to send.' },
          { re: /^ping -c ?\d+ 192\.168\.50\.1$/, msg: 'Close. The mission says exactly four.' }
        ],
        out: 'PING 192.168.50.1 (192.168.50.1) 56(84) bytes of data.\n64 bytes from 192.168.50.1: icmp_seq=1 ttl=64 time=0.41 ms\n64 bytes from 192.168.50.1: icmp_seq=2 ttl=64 time=0.38 ms\n64 bytes from 192.168.50.1: icmp_seq=3 ttl=64 time=0.40 ms\n64 bytes from 192.168.50.1: icmp_seq=4 ttl=64 time=0.37 ms\n\n--- 192.168.50.1 ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss, time 3051ms',
        what: 'ping with a count',
        why: '0% loss. The local path to the gateway works.' },
      { task: 'The gateway answers. Test beyond it: four pings to the public address <b>1.1.1.1</b>.',
        accept: [{ re: /^ping -c ?4 1\.1\.1\.1$/ }, { re: /^ping 1\.1\.1\.1 -c ?4$/ }],
        answer: 'ping -c 4 1.1.1.1', hint: 'Same shape as the last command, new address.',
        partial: [{ re: /^ping 1\.1\.1\.1$/, msg: 'Add the flag that sends exactly four.' }],
        out: 'PING 1.1.1.1 (1.1.1.1) 56(84) bytes of data.\n64 bytes from 1.1.1.1: icmp_seq=1 ttl=57 time=14.2 ms\n64 bytes from 1.1.1.1: icmp_seq=2 ttl=57 time=13.9 ms\n64 bytes from 1.1.1.1: icmp_seq=3 ttl=57 time=14.1 ms\n64 bytes from 1.1.1.1: icmp_seq=4 ttl=57 time=14.0 ms\n\n--- 1.1.1.1 ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss, time 3005ms',
        what: 'ping a public IP',
        why: 'The internet answers by number, so the router, ISP and cable are fine.' },
      { task: 'Both pings pass, but users say websites will not open <b>by name</b>. Which command tests the name <code>example.com</code>?',
        accept: [{ re: /^nslookup example\.com$/ }, { re: /^dig example\.com( a)?$/ }, { re: /^host example\.com$/ }],
        answer: 'nslookup example.com', hint: 'It is a lookup for a name server. <code>dig</code> and <code>host</code> work too.',
        out: ';; communications error to 192.168.50.1#53: timed out\n;; no servers could be reached', what: 'test name lookup',
        why: 'Timed out. Numbers work and names do not, so this is a DNS problem, not a cable problem.' },
      { task: 'The DNS server the router handed out is not answering. Ask a <b>different resolver</b>, 1.1.1.1, for <code>example.com</code>.',
        accept: [{ re: /^nslookup example\.com 1\.1\.1\.1$/ }, { re: /^dig @1\.1\.1\.1 example\.com$/ }, { re: /^dig example\.com @1\.1\.1\.1$/ }],
        answer: 'nslookup example.com 1.1.1.1', hint: 'Same lookup as before, with the server you want to ask added at the end.',
        out: 'Server:\t\t1.1.1.1\nAddress:\t1.1.1.1#53\n\nNon-authoritative answer:\nName:\texample.com\nAddress: 203.0.113.15', what: 'ask another DNS server',
        why: 'Names resolve through 1.1.1.1. The fault is the DNS server DHCP gave out. You found it with three tests and changed nothing.' }
    ]
  },
  ps: {
    name: 'PowerShell',
    cls: 'ps',
    start: 'C:\\Users\\student',
    title: function () { return 'Windows PowerShell'; },
    banner: ['Windows PowerShell', 'Copyright (C) Microsoft Corporation. All rights reserved.', ''],
    notFound: function (c) { return c + " : The term '" + c + "' is not recognized as the name of a cmdlet, function, script file, or operable program."; },
    known: 'pwd ls dir cd md mkdir ipconfig ping nslookup whoami hostname cls clear echo cat type get-location get-childitem set-location gl gci sl tracert arp netstat'.split(' '),
    screens: [
      { task: 'You just opened PowerShell. Print the folder you are standing in.',
        accept: [{ re: /^(pwd|get-location|gl)$/i }], answer: 'pwd', hint: 'Three letters. It stands for "print working directory".',
        out: '\nPath\n----\nC:\\Users\\student\n', what: 'where am I?',
        why: '<code>pwd</code> works in PowerShell too. Its full name is <code>Get-Location</code>.' },
      { task: 'List what is in this folder.',
        accept: [{ re: /^(ls|dir|gci|get-childitem)$/i }], answer: 'ls', hint: 'Two letters. <code>dir</code> works too.',
        out: '\n    Directory: C:\\Users\\student\n\nMode                 LastWriteTime         Length Name\n----                 -------------         ------ ----\nd-----        10/26/2026   8:02 AM                blueland\nd-r---        10/26/2026   8:02 AM                Documents\n-a----        10/26/2026   8:05 AM            212 notes.txt\n',
        what: 'what is here?',
        why: 'PowerShell prints a table. <code>d</code> in the Mode column means directory.' },
      { task: 'Walk into the folder named <code>blueland</code>.',
        accept: [{ re: /^(cd|sl|set-location|chdir) (\.\\)?blueland\\?$/i }], answer: 'cd blueland', hint: 'The command that changes directory, then the folder name.',
        partial: [{ re: /^cd$/i, msg: '<code>cd</code> needs to know where to go. Give it the folder name.' }],
        out: '', cwd: 'C:\\Users\\student\\blueland', what: 'move into a folder',
        why: 'The path in the prompt changed. Same <code>cd</code> as Linux.' },
      { task: 'Step back out one level.',
        accept: [{ re: /^(cd|sl|set-location|chdir) ?\.\.\\?$/i }], answer: 'cd ..', hint: 'The place to go is two dots.',
        partial: [{ re: /^cd ?\.$/i, msg: 'One dot means "right here". Two dots mean "the folder above".' }],
        out: '', cwd: 'C:\\Users\\student', what: 'move up one level',
        why: '<code>..</code> means the folder above, on Windows and Linux.' },
      { task: 'Build a new folder named <code>cleared</code>.',
        accept: [{ re: /^(mkdir|md) (\.\\)?cleared\\?$/i }, { re: /^new-item -itemtype directory (-name )?cleared$/i }], answer: 'mkdir cleared', hint: 'Short for "make directory".',
        out: '\n    Directory: C:\\Users\\student\n\nMode                 LastWriteTime         Length Name\n----                 -------------         ------ ----\nd-----        10/26/2026   8:09 AM                cleared\n', what: 'make a folder',
        why: 'PowerShell shows you what it built. Linux says nothing when it works.' },
      { task: 'New work order: the lab has no network. Show <b>every detail</b> of this PC\'s network settings, not the short version.',
        accept: [{ re: /^ipconfig ?\/all$/i }], answer: 'ipconfig /all', hint: 'The command is <code>ipconfig</code>. Add the switch that means "all".',
        partial: [{ re: /^ipconfig$/i, msg: 'That is the short version. Add the switch that shows everything.' }],
        out: '\nWindows IP Configuration\n\nEthernet adapter Ethernet:\n\n   Physical Address. . . . . . . . . : 02-42-AC-11-00-02\n   DHCP Enabled. . . . . . . . . . . : Yes\n   IPv4 Address. . . . . . . . . . . : 192.168.50.121(Preferred)\n   Subnet Mask . . . . . . . . . . . : 255.255.255.0\n   Default Gateway . . . . . . . . . : 192.168.50.1\n   DHCP Server . . . . . . . . . . . : 192.168.50.1\n   DNS Servers . . . . . . . . . . . : 192.168.50.1\n',
        what: 'show all network settings',
        why: 'A real address, a gateway and a DHCP server. Not 169.254, so DHCP worked.' },
      { task: 'Test the gateway, <b>192.168.50.1</b>.',
        accept: [{ re: /^ping 192\.168\.50\.1$/i }, { re: /^ping -n ?4 192\.168\.50\.1$/i }], answer: 'ping 192.168.50.1', hint: 'The command is <code>ping</code>, then the address.',
        out: '\nPinging 192.168.50.1 with 32 bytes of data:\nReply from 192.168.50.1: bytes=32 time<1ms TTL=64\nReply from 192.168.50.1: bytes=32 time<1ms TTL=64\nReply from 192.168.50.1: bytes=32 time<1ms TTL=64\nReply from 192.168.50.1: bytes=32 time<1ms TTL=64\n\nPing statistics for 192.168.50.1:\n    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),\n',
        what: 'ping the gateway',
        why: 'Windows sends four pings by itself. Linux keeps going unless you add <code>-c 4</code>.' },
      { task: 'The gateway answers. Test beyond it: ping the public address <b>1.1.1.1</b>.',

var S = { day: 'd01', track: 'linux', i: 0, misses: 0, phase: 'ask', results: [], assisted: false, cwd: '~', t0: 0 };
var $ = function (id) { return document.getElementById(id); };
var body = $('body'), form = $('form'), cmd = $('cmd'), coach = $('coach'), actions = $('actions');

function T() { return TRACKS[S.track]; }
function norm(s) { return s.trim().replace(/\s+/g, ' '); }

function promptEl(cwd) {
  var s = document.createElement('span');
  s.className = 'pr';
  if (S.track === 'linux') {
    s.innerHTML = '<span class="u"></span>:<span class="p"></span>$';
    s.querySelector('.u').textContent = 'student@' + (T().host || 'kali');
    s.querySelector('.p').textContent = cwd;
  } else {
    s.textContent = 'PS ' + cwd + '>';
  }
  return s;
}
function addLine(text, cls) {
  var d = document.createElement('div');
  d.className = 'ln ' + (cls || '');
  d.textContent = text;
  body.insertBefore(d, form);
  return d;
}
function addOut(text, cls) {
  if (!text) return;
  var p = document.createElement('pre');
  p.className = 'out ' + (cls || '');
  p.textContent = String(text).replace(/\{host\}/g, T().host || 'kali');
  body.insertBefore(p, form);
}
function addCmd(text) {
  var d = document.createElement('div');
  d.className = 'ln';
  d.appendChild(promptEl(S.cwd));
  var c = document.createElement('span');
  c.className = 'cmdtxt';
  c.textContent = ' ' + text;
  d.appendChild(c);
  body.insertBefore(d, form);
}
function scrollDown() { body.scrollTop = body.scrollHeight; }

function drawProgress() {
  var n = T().screens.length;
  var h = '';
  for (var k = 0; k < n; k++) {
    var c = S.results[k] || (k === S.i && S.phase !== 'end' ? 'now' : '');
    h += '<i class="' + c + '"></i>';
  }
  $('progress').innerHTML = h;
  $('count').textContent = S.phase === 'end' ? 'Finished' : 'Screen ' + (S.i + 1) + ' of ' + n;
}

function startTrack(name) {
  S = { day: S.day, track: name, i: 0, misses: 0, phase: 'ask', results: [], assisted: false, cwd: TRACKS[name].start, t0: 0 };
  document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.track === name ? 'true' : 'false'); });
  $('term').className = 'term ' + T().cls;
  // clear transcript
  Array.prototype.slice.call(body.children).forEach(function (el) { if (el !== form) body.removeChild(el); });
  T().banner.forEach(function (l) { addLine(l, 'dim'); });
  $('summary').hidden = true;
  $('missionBox').hidden = false; $('term').hidden = false;
  showScreen();
}

function showScreen() {
  var sc = T().screens[S.i];
  S.misses = 0; S.assisted = false; S.phase = 'ask';
  $('task').innerHTML = sc.task;
  $('termTitle').textContent = T().title(S.cwd);
  var slot = $('promptSlot'); slot.innerHTML = ''; slot.appendChild(promptEl(S.cwd));
  cmd.disabled = false; cmd.value = '';
  coach.innerHTML = '<p>Type the next command and press Enter.</p>';
  actions.innerHTML = '';
  drawProgress();
  scrollDown();
  cmd.focus({ preventScroll: true });
}

function check(raw) {
  var sc = T().screens[S.i];
  var c = norm(raw);
  if (!c) return;
  if (!S.t0) S.t0 = Date.now();
  var i, m;
  for (i = 0; i < sc.accept.length; i++) {
    if (sc.accept[i].re.test(c)) { return success(raw, sc, sc.accept[i]); }
  }
  addCmd(raw.trim());
  var first = c.split(' ')[0].toLowerCase();
  S.misses++;
  var msg = null;
  for (i = 0; sc.partial && i < sc.partial.length; i++) { if (sc.partial[i].re.test(c)) { msg = sc.partial[i].msg; break; } }
  if (msg) {
    // a close-but-wrong command gets its own specific coaching
  } else if (T().known.indexOf(first) === -1) {
    addLine(T().notFound(c.split(' ')[0]), 'err');
    msg = 'The terminal does not know that command. Check the spelling.';
  } else {
    msg = 'That is a real command, but it does not do what this mission asks. Read the mission again.';
  }
  var html = '<p><span class="no">Not yet.</span> ' + msg + '</p>';
  if (S.misses >= 2) html += '<p>Hint: ' + sc.hint + '</p>';
  coach.innerHTML = html;
  actions.innerHTML = '';
  if (S.misses >= 3) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = 'Show me the command';
    b.onclick = function () { S.assisted = true; cmd.value = sc.answer; cmd.focus(); coach.innerHTML = '<p>Press Enter to run it, then read the output.</p>'; actions.innerHTML = ''; };
    actions.appendChild(b);
  }
  cmd.value = '';
  $('term').classList.remove('shake'); void $('term').offsetWidth; $('term').classList.add('shake');
  scrollDown();
}

function success(raw, sc, hit) {
  addCmd(raw.trim());
  addOut(hit.out !== undefined ? hit.out : sc.out);
  if (sc.cwd) S.cwd = sc.cwd;
  S.results[S.i] = S.assisted ? 'shown' : (S.misses ? 'retry' : 'first');
  S.phase = 'done';
  cmd.disabled = true; cmd.value = '';
  var slot = $('promptSlot'); slot.innerHTML = ''; slot.appendChild(promptEl(S.cwd));
  $('termTitle').textContent = T().title(S.cwd);
  coach.innerHTML = '<p><span class="ok">Correct.</span> ' + (hit.note ? hit.note + ' ' : '') + sc.why + '</p>';
  var last = S.i === T().screens.length - 1;
  actions.innerHTML = '';
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'btn primary'; b.textContent = last ? 'Finish' : 'Next screen';
  b.onclick = next;
  actions.appendChild(b);
  drawProgress();
  scrollDown();
  b.focus({ preventScroll: true });
}

function next() {
  if (S.i >= T().screens.length - 1) return finish();
  S.i++;
  showScreen();
}

function finish() {
  S.phase = 'end';
  drawProgress();
  var sc = T().screens, n = sc.length;
  var f = S.results.filter(function (r) { return r === 'first'; }).length;
  var r = S.results.filter(function (r) { return r === 'retry'; }).length;
  var s = S.results.filter(function (r) { return r === 'shown'; }).length;
  var secs = Math.max(1, Math.round((Date.now() - S.t0) / 1000));
  var mm = Math.floor(secs / 60), ss = ('0' + (secs % 60)).slice(-2);
  var other = S.track === 'linux' ? 'ps' : 'linux';
  var h = '<h2>Session complete</h2><ul class="stats">' +
    '<li><b>' + f + '</b> of ' + n + ' on the first try</li>' +
    '<li><b>' + r + '</b> after a retry</li>' +
    '<li><b>' + s + '</b> with "Show me"</li>' +
    '<li><b>' + mm + ':' + ss + '</b> total</li></ul>' +
    '<p class="label">Your command log</p><ul class="log">';
  sc.forEach(function (x) { h += '<li><code></code><span>' + x.what + '</span></li>'; });
  h += '</ul><div class="actions"><button class="btn primary" id="again" type="button">Run it again</button>' +
    '<button class="btn" id="swap" type="button">Try ' + TRACKS[other].name + '</button></div>';
  var box = $('summary'); box.innerHTML = h;
  box.querySelectorAll('.log code').forEach(function (el, k) { el.textContent = sc[k].answer; });
  box.hidden = false;
  $('missionBox').hidden = true; $('term').hidden = true;
  coach.innerHTML = ''; actions.innerHTML = '';
  $('again').onclick = function () { startTrack(S.track); };
  $('swap').onclick = function () { startTrack(other); };
  $('again').focus({ preventScroll: true });
}

document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { if (!DAYS[S.day].rest) startTrack(b.dataset.track); }); });
body.addEventListener('click', function () { if (S.phase === 'ask') cmd.focus(); });
var daySel = $('daySel');
function todayKey() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function sortedIds() { return Object.keys(DAYS).sort(function (a, b) { return DAYS[a].date < DAYS[b].date ? -1 : 1; }); }
function pickDay() {
  var h = (location.hash || '').replace('#', '');
  if (DAYS[h]) return { id: h, auto: false };
  var ids = sortedIds(), t = todayKey(), hit = ids.filter(function (k) { return DAYS[k].date === h; });
  if (hit.length) return { id: hit[0], auto: false };
  var pick = ids[0], exact = false;
  ids.forEach(function (k) { if (DAYS[k].date <= t) pick = k; if (DAYS[k].date === t) exact = true; });
  var notice = '';
  if (t < DAYS[ids[0]].date) notice = 'The first set opens ' + DAYS[ids[0]].label.split(' · ')[1] + '. Showing it early.';
  else if (!exact) notice = 'No new set today. Showing the most recent one.';
  return { id: pick, auto: true, notice: notice };
}
function showRest(d) {
  $('missionBox').hidden = true; $('term').hidden = true; $('progress').innerHTML = ''; $('count').textContent = '';
  coach.innerHTML = ''; actions.innerHTML = '';
  var box = $('summary'); box.innerHTML = '<h2></h2>'; box.firstChild.textContent = d.rest; box.hidden = false;

function loadDay(id, auto, notice) {
  S.day = id; TRACKS = DAYS[id].tracks || {};
  $('dayLabel').textContent = 'AP Networking · ' + DAYS[id].label;
  $('wo').textContent = DAYS[id].wo;

  if (DAYS[id].rest) return showRest(DAYS[id]);
  startTrack(TRACKS[S.track] ? S.track : 'linux');
}
function route() { var p = pickDay(); loadDay(p.id, p.auto, p.notice); }
var first = document.createElement('option'); first.value = ''; first.textContent = 'Today'; daySel.appendChild(first);
sortedIds().forEach(function (id) { var o = document.createElement('option'); o.value = id; o.textContent = DAYS[id].label; daySel.appendChild(o); });
daySel.hidden = false;
daySel.addEventListener('change', function () {
  if (daySel.value) { location.hash = daySel.value; }

});
